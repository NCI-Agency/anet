name-template: "ANET $NEXT_MINOR_VERSION"
tag-template: "$NEXT_MINOR_VERSION"
filter-by-commitish: true
commitish: main
version-template: "$MAJOR.$MINOR.$PATCH"
categories:
  - type: 'pre-exclude'
    when:
      labels:
        - devDependencies
        - internal
        - DevOps
        - documentation
  - title: '🚀 Features'
    when:
      label: feature
  - title: '🎨 Enhancements'
    when:
      label: enhancement
  - title : '🖌 Improvements'
    when:
      label: improvement
  - title: '🐛 Bug Fixes'
    when:
      label: bug
  - title: '⬆️ Dependency Updates'
    when:
      label: dependencies
  - title: '🔧 Under the hood'
    when:
      label: debt
change-template: "* $TITLE (#$NUMBER)"
template: |
  ## What’s changed in ANET

  $CHANGES
