name: Build ANET

on:
  push:
    branches:
    - '**'
    tags:
    - '**'
  pull_request:
    branches:
    - main

permissions:
  contents: read

env:
  NODE_OPTIONS: '--max-old-space-size=8192'
  DB_DRIVER: postgresql
  DB_VERSION: 15

jobs:
  build:
    name: Build with Gradle
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: ./.github/actions/build-cache
    - run: ./gradlew check -x test
    - run: ./gradlew prettierCheck
    - run: ./gradlew yarn_run_lint
    - run: ./gradlew jar buildClient

  package-rpm:
    name: Package RHEL 9 RPM
    needs: [build, test-init, test-server, test-client, test-sim]
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-java@v6
      with:
        distribution: "temurin"
        java-version: 21
    - name: Install packaging tools
      run: sudo apt-get update && sudo apt-get install -y binutils
    - name: Build ANET RPM
      run: ./scripts/build-rpm.sh
    - name: Validate installation in minimal UBI 9
      run: ./scripts/test-rpm.sh build/distributions/*.el9.x86_64.rpm
    - name: Upload RHEL 9 RPM
      uses: actions/upload-artifact@v7
      with:
        path: build/distributions/*.el9.x86_64.rpm
        if-no-files-found: error
        archive: false

  test-init:
    needs: build
    name: Test ANET init
    runs-on: ubuntu-latest

    env:
      ANET_ADMIN_ORG_NAME: "ACME Administrators Inc."
      ANET_ADMIN_POS_NAME: "The ANET admin"
      ANET_ADMIN_FULL_NAME: "DOE, John"
      ANET_ADMIN_DOMAIN_USERNAME: "johndoe"

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/build-cache
      - name: Start DB and Keycloak containers
        run: |
          ./gradlew -PtestEnv dockerCreateDB dockerStartDB dockerConfigureKeycloak dockerStartKeycloak
          sleep 30
      # This step should fail:
      - name: Run ANET init on empty database
        id: init-on-empty-db
        run: ./gradlew -PtestEnv dbInit
        env:
          ANET_DB_MIGRATE: false
        continue-on-error: true
      - run: exit 1
        if: ${{ steps.init-on-empty-db.outcome != 'failure' }}
      # This step should succeed:
      - name: Run ANET init on clean database
        id: init-on-clean-db
        run: ./gradlew -PtestEnv dbInit
        env:
          SPRING_PROFILES_ACTIVE: prod
      # This step should fail:
      - name: Run ANET init on filled database
        id: init-on-filled-db
        run: ./gradlew -PtestEnv dbInit
        continue-on-error: true
      - run: exit 1
        if: ${{ steps.init-on-filled-db.outcome != 'failure' }}

  test-server:
    needs: build
    name: Server tests; ${{ matrix.dictionary }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dictionary: [anet-dictionary.yml, testDictionaries/no-custom-fields.yml]

    env:
      ANET_DICTIONARY_NAME: ${{ matrix.dictionary }}

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: ./.github/actions/build-cache
    - run: |
        rm -rf client/build/test-results
        mkdir -p client/build/test-results
    - name: Start DB, Keycloak and SMTP containers
      run: |
        ./gradlew -PtestEnv dockerCreateDB dockerStartDB dockerConfigureKeycloak dockerStartKeycloak dockerCreateFakeSmtpServer dockerStartFakeSmtpServer
        sleep 30
    - run: ./gradlew -PtestEnv test jacocoTestReport
    - run: ./gradlew yarn_run_server-junit-merge
    - name: Strip slashes from dictionary name
      id: strip-slashes
      run: echo "dictionary=${ANET_DICTIONARY_NAME//\//_}" >> $GITHUB_OUTPUT
      if: always()
    - name: Upload test results
      uses: actions/upload-artifact@v7
      with:
        name: server-test-results for ${{ steps.strip-slashes.outputs.dictionary }}
        path: client/build/test-results/server-test-results.xml
      if: always()

  test-client:
    needs: build
    name: Client tests; ${{ matrix.client-tests }}, ${{ matrix.dictionary }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dictionary: [anet-dictionary.yml]
        client-tests: [jest, playwright, e2e]
        include:
          - dictionary: testDictionaries/no-custom-fields.yml
            client-tests: playwright-noCF

    env:
      ANET_DICTIONARY_NAME: ${{ matrix.dictionary }}
      CLIENT_TESTS: ${{ matrix.client-tests }}

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: ./.github/actions/build-cache
    - run: |
        rm -rf client/build/test-results
        mkdir -p client/build/test-results
    - name: Start DB, Keycloak and SMTP containers
      run: |
        ./gradlew -PtestEnv dockerCreateDB dockerStartDB dockerConfigureKeycloak dockerStartKeycloak dockerCreateFakeSmtpServer dockerStartFakeSmtpServer
        sleep 30
    - run: ./gradlew -PtestEnv checkConfig
    - name: Start ANET and wait for readiness
      run: |
        ./gradlew -PtestEnv run &
        for attempt in {1..180}; do
          if curl --fail --silent --header "Accept: text/html" --output /dev/null http://localhost:8180/; then
            exit 0
          fi
          sleep 1
        done
        exit 1
    - name: Install Playwright Chromium
      if: matrix.client-tests != 'jest'
      run: ./gradlew yarn_run_install-playwright
    - run: ./gradlew yarn_run_test-${CLIENT_TESTS}
    - name: Strip slashes from dictionary name
      id: strip-slashes
      run: echo "dictionary=${ANET_DICTIONARY_NAME//\//_}" >> $GITHUB_OUTPUT
      if: always()
    - name: Upload Playwright diagnostics
      if: always() && matrix.client-tests != 'jest'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.client-tests }}-diagnostics for ${{ steps.strip-slashes.outputs.dictionary }}
        path: |
          client/build/${{ matrix.client-tests }}-report
          client/build/test-results/${{ matrix.client-tests }}-artifacts
        if-no-files-found: ignore
    - name: Upload client log
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.client-tests }}-client-log for ${{ steps.strip-slashes.outputs.dictionary }}
        path: logs/clientLog.log
        if-no-files-found: ignore
      if: always()
    - name: Upload test results
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.client-tests }}-test-results for ${{ steps.strip-slashes.outputs.dictionary }}
        path: client/build/test-results/${{ matrix.client-tests }}-test-results.xml
      if: always()

  test-sim:
    needs: build
    name: Test simulator
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: ./.github/actions/build-cache
    - name: Start DB and Keycloak containers
      run: |
        ./gradlew dockerCreateDB dockerStartDB dockerConfigureKeycloak dockerStartKeycloak
        sleep 30
    - run: ./gradlew checkConfig
    - run: |
        ./gradlew run &
        sleep 15
    - run: ./gradlew yarn_run_sim
      env:
        TEST_RUN: true
    - name: Show Keycloak logs
      run: docker logs anet-keycloak-server
      if: always()
